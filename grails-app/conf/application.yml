---
grails:
    profile: web
    codegen:
        defaultPackage: org.bbop.apollo
    gorm:
        failOnError: true
        reactor:
            events: false
    # External config: apollo-config.groovy is still supported!
    # Apollo 7 loads apollo-config.groovy automatically via ApolloConfigLoader.
    # Search order:
    #   1. -Dapollo.config.location=/path/to/apollo-config.groovy
    #   2. APOLLO_CONFIG_LOCATION env var
    #   3. ./apollo-config.groovy (current working directory)
    #   4. apollo-config.groovy on the classpath
    # The environment-specific blocks (environments { production { ... } })
    # work the same as in Apollo 2.
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback-spring.xml'
                - '*.properties'
environments:
    development:
        management:
            endpoints:
                enabled-by-default: true
                web:
                    base-path: '/actuator'
                    exposure:
                        include: '*'
    production:
        management:
            endpoints:
                enabled-by-default: false

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

# BACKWARDS INCOMPATIBILITY: CORS is now configured via Spring Boot
# instead of the cors plugin. The old cors.url.pattern = '*' config
# is replaced by this Spring-native configuration.
server:
    servlet:
        context-path: /apollo

---
# Apollo application settings
# Apollo application defaults. Custom overrides can be provided via
# apollo-config.groovy (same format as Apollo 2) or application-apollo.yml.
apollo:
    default_minimum_intron_size: 1
    history_size: 0
    overlapper_class: "org.bbop.apollo.sequence.OrfOverlapper"
    track_name_comparator: "/config/track_name_comparator.js"
    use_cds_for_new_transcripts: false
    count_annotations: true
    add_merged_comment: true
    transcript_overlapper: "CDS"
    feature_has_dbxrefs: true
    feature_has_attributes: true
    feature_has_pubmed_ids: true
    feature_has_go_ids: true
    feature_has_comments: true
    feature_has_status: true
    export_subfeatures_attr: false
    user_pure_memory_store: true
    is_partial_translation_allowed: false
    export_subfeature_attrs: false
    store_orig_id: true
    calculate_non_canonical_splice_sites: true
    common_data_directory: "apollo_data"
    chado_export_fasta_for_sequence: false
    chado_export_fasta_for_cds: false
    only_owners_delete: false
    get_translation_code: 1
    fa_to_twobit_exe: "/usr/local/bin/faToTwoBit"
    splice_donor_sites:
        - "GT"
    splice_acceptor_sites:
        - "AG"
    gff3:
        source: "."
    bootstrap: false
    native_track_selector_default_on: false
    authentications:
        - name: "Username Password Authenticator"
          className: "usernamePasswordAuthenticatorService"
          active: true
    admin:
        username: admin@local.host
        password: password
        firstName: Admin
        lastName: User

---
hibernate:
    allow_update_outside_transaction: true
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
        # BACKWARDS INCOMPATIBILITY: Hibernate second-level cache disabled.
        # Old: ehcache with SingletonEhCacheRegionFactory
        # To re-enable, add an ehcache or caffeine dependency and configure
        # hibernate.cache.region.factory_class accordingly.
dataSource:
    pooled: true
    jmxExport: true
    driverClassName: org.h2.Driver
    username: sa
    password: ''

grails:
    plugin:
        databasemigration:
            updateOnStart: ${APOLLO_MIGRATION_ON_START:false}
            updateOnStartFileName: changelog.groovy

environments:
    development:
        dataSource:
            dbCreate: update
            url: jdbc:h2:./devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    test:
        dataSource:
            dbCreate: create-drop
            url: jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    production:
        dataSource:
            dbCreate: ${APOLLO_DB_CREATE:update}
            # Production DB can be configured via apollo-config.groovy (same as
            # Apollo 2) or environment variables: APOLLO_DB_URL, APOLLO_DB_DRIVER,
            # APOLLO_DB_USERNAME, APOLLO_DB_PASSWORD
            url: ${APOLLO_DB_URL:}
            driverClassName: ${APOLLO_DB_DRIVER:org.postgresql.Driver}
            username: ${APOLLO_DB_USERNAME:}
            password: ${APOLLO_DB_PASSWORD:}
            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED
