buildscript {
    repositories {
        mavenCentral()
        maven {
            url = 'https://repo.grails.org/grails/restricted'
        }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"
        classpath "org.apache.grails:grails-data-hibernate5"
        classpath "cloud.wondrify:asset-pipeline-gradle"
    }
}

version = "2.8.1"
group = "org.bbop.apollo"

apply plugin:"eclipse"
apply plugin:"idea"
apply plugin:"war"
apply plugin:"org.apache.grails.gradle.grails-web"
apply plugin:"cloud.wondrify.asset-pipeline"
apply plugin:"org.apache.grails.gradle.grails-gsp"

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.grails.org/grails/restricted'
    }
}

configurations.configureEach {
}

dependencies {
    console "org.apache.grails:grails-console"
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")

    // Grails core
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.apache.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-layout"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-scaffolding"
    implementation "org.apache.grails:grails-data-hibernate5"
    implementation "org.apache.grails:grails-gsp"

    // WebSocket support
    implementation "org.springframework.boot:spring-boot-starter-websocket"

    // Spring Security (replaces Shiro)
    implementation "org.springframework.boot:spring-boot-starter-security"

    // Database drivers
    runtimeOnly "com.mysql:mysql-connector-j:9.2.0"
    runtimeOnly "org.postgresql:postgresql:42.7.4"
    runtimeOnly "com.h2database:h2"
    runtimeOnly "com.zaxxer:HikariCP"

    // Data processing
    // BACKWARDS INCOMPATIBILITY: htsjdk 4.x has breaking changes from 2.x
    // (removed deprecated APIs, changed package structure)
    implementation "com.github.samtools:htsjdk:4.1.3"
    implementation "commons-codec:commons-codec:1.17.1"
    implementation "commons-collections:commons-collections:3.2.2"
    implementation "commons-io:commons-io:2.18.0"
    implementation "org.apache.commons:commons-compress:1.27.1"
    implementation "org.json:json:20240303"
    implementation "commons-beanutils:commons-beanutils:1.9.4"
    implementation "org.codehaus.plexus:plexus-archiver:4.10.0"
    implementation "org.apache.commons:commons-text:1.12.0"
    implementation "org.apache.commons:commons-lang3:3.17.0"
    implementation "com.google.guava:guava:33.4.0-jre"

    // SVG generation
    implementation "org.apache.xmlgraphics:batik-svg-dom:1.18"
    implementation "org.apache.xmlgraphics:batik-svggen:1.18"

    // Database migration (Liquibase-based schema management)
    implementation "org.apache.grails:grails-data-hibernate5-dbmigration"

    // Asset pipeline
    runtimeOnly "cloud.wondrify:asset-pipeline-grails"

    // Quartz scheduling
    // TODO: verify quartz plugin version for Grails 7
    // implementation "org.grails.plugins:quartz:2.0.13"

    // Webjars for frontend
    testAndDevelopmentOnly "org.webjars.npm:bootstrap"
    testAndDevelopmentOnly "org.webjars.npm:bootstrap-icons"
    testAndDevelopmentOnly "org.webjars.npm:jquery"

    // Testing
    integrationTestImplementation testFixtures("org.apache.grails:grails-geb")
    profile "org.apache.grails.profiles:web"
    runtimeOnly "org.fusesource.jansi:jansi"
    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.spockframework:spock-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
}

compileJava.options.release = 17

// JBrowse 1 installation tasks

ext {
    jbrowseGitUrl = "https://github.com/gmod/jbrowse"
    jbrowseBranch = "1.16.12-release"
    jbrowseDir = file("jbrowse")
    jbrowseWebappDir = file("src/main/webapp/jbrowse")
}

task cloneJBrowse {
    description "Clone JBrowse 1 from git"
    onlyIf { !jbrowseDir.exists() }
    doLast {
        exec {
            commandLine "git", "clone", jbrowseGitUrl, "--branch", jbrowseBranch, "--single-branch", "--depth", "1"
        }
    }
}

task installJBrowseWebOnly {
    description "Install JBrowse for web (no Perl tools)"
    doLast {
        if (!jbrowseDir.exists()) {
            tasks.cloneJBrowse.execute()
        }
        exec {
            workingDir "jbrowse"
            commandLine "yarn"
        }
        delete "jbrowse/plugins/WebApollo"
        copy {
            from "client/apollo"
            into "jbrowse/plugins/WebApollo"
        }
        exec {
            workingDir "jbrowse/plugins/WebApollo"
            commandLine "yarn"
        }
        exec {
            workingDir "jbrowse"
            commandLine "npm", "run", "build"
        }
        delete jbrowseWebappDir
        copy {
            from("jbrowse") {
                exclude "sample_data/**", "node_modules/**", "tests/**", ".git/**"
            }
            into jbrowseWebappDir
        }
    }
}

task installJBrowse {
    description "Install JBrowse with Perl tools"
    doLast {
        if (!jbrowseDir.exists()) {
            tasks.cloneJBrowse.execute()
        }
        exec {
            workingDir "jbrowse"
            commandLine "yarn"
        }
        delete "jbrowse/plugins/WebApollo"
        copy {
            from "client/apollo"
            into "jbrowse/plugins/WebApollo"
        }
        exec {
            workingDir "jbrowse/plugins/WebApollo"
            commandLine "yarn"
        }
        exec {
            workingDir "jbrowse"
            commandLine "./setup.sh"
        }
        delete jbrowseWebappDir
        copy {
            from("jbrowse") {
                exclude "sample_data/**", "node_modules/**", "tests/**", ".git/**"
            }
            into jbrowseWebappDir
        }
    }
}

task cleanJBrowse(type: Delete) {
    description "Remove JBrowse build artifacts"
    delete jbrowseDir, jbrowseWebappDir
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// https://github.com/apache/grails-core/issues/15321
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = false
    groovyOptions.fork = true
    groovyOptions.forkOptions.memoryMaximumSize = '4g'
}


assets {
    excludes = [
            'webjars/jquery/**',
            'webjars/bootstrap/**',
            'webjars/bootstrap-icons/**'
    ]
    includes = [
            'webjars/jquery/*/dist/jquery.js',
            'webjars/bootstrap/*/dist/js/bootstrap.bundle.js',
            'webjars/bootstrap/*/dist/css/bootstrap.css',
            'webjars/bootstrap-icons/*/font/bootstrap-icons.css',
            'webjars/bootstrap-icons/*/font/fonts/*',
    ]
}
