name: Python-Apollo

on:
  push:
    branches: [develop, apollo_g7]
  pull_request:
    branches: [develop]

jobs:
  test-python-apollo:
    name: test-python-apollo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Apollo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Apollo
        run: ./gradlew classes

      - name: Start Apollo
        run: |
          ./gradlew bootRun > apollo.log 2>&1 &

          # Wait for health endpoint
          for i in $(seq 1 300); do
            response=$(curl -s 'http://localhost:8080/apollo/health/index' 2>/dev/null || true)
            if echo "$response" | grep -q '"status":"ready"'; then
              echo "Apollo is ready (${i}s)"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "FAIL: Apollo not ready after 300 seconds"
              cat apollo.log
              exit 1
            fi
            sleep 1
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout python-apollo
        uses: actions/checkout@v4
        with:
          repository: galaxy-genome-annotation/python-apollo
          path: python-apollo
          ref: master

      - name: Install python-apollo
        run: |
          cd python-apollo
          pip install apollo pytest

      - name: Bootstrap test data
        run: |
          cd python-apollo
          export ARROW_GLOBAL_CONFIG_PATH=$(pwd)/test-data/local-apollo2-arrow.yml
          ./bootstrap_apollo.sh --nodocker

      - name: Diagnose organism state
        run: |
          cd python-apollo
          export ARROW_GLOBAL_CONFIG_PATH=$(pwd)/test-data/local-apollo2-arrow.yml
          echo "=== Organisms ==="
          arrow organisms get_organisms
          echo "=== Sequences for test_organism ==="
          arrow organisms get_sequences test_organism || true
          echo "=== Features for test_organism on Merlin ==="
          arrow annotations get_features test_organism Merlin || true

          echo ""
          echo "=== Direct curl: addTranscript on test_organism ==="
          ORG_DIR=$(cd .. && pwd)/python-apollo/apollo_shared_dir
          curl -s -X POST http://localhost:8080/apollo/annotationEditor/addTranscript \
            -H 'Content-Type: application/json' \
            -d "{
              \"username\": \"admin@local.host\",
              \"password\": \"password\",
              \"organism\": \"test_organism\",
              \"sequence\": \"Merlin\",
              \"suppressHistory\": true,
              \"suppressEvents\": true,
              \"features\": [{
                \"location\": {\"fmin\": 100, \"fmax\": 500, \"strand\": 1},
                \"type\": {\"name\": \"mRNA\", \"cv\": {\"name\": \"sequence\"}},
                \"children\": [{
                  \"location\": {\"fmin\": 100, \"fmax\": 500, \"strand\": 1},
                  \"type\": {\"name\": \"exon\", \"cv\": {\"name\": \"sequence\"}}
                }]
              }]
            }" || true

          echo ""
          echo "=== Direct curl: addFeature on test_organism ==="
          curl -s -X POST http://localhost:8080/apollo/annotationEditor/addFeature \
            -H 'Content-Type: application/json' \
            -d "{
              \"username\": \"admin@local.host\",
              \"password\": \"password\",
              \"organism\": \"test_organism\",
              \"sequence\": \"Merlin\",
              \"features\": [{
                \"location\": {\"fmin\": 1000, \"fmax\": 2000, \"strand\": 1},
                \"type\": {\"name\": \"repeat_region\", \"cv\": {\"name\": \"sequence\"}}
              }]
            }" || true

          echo ""
          echo "=== Apollo ERROR/WARN log lines ==="
          grep -E 'ERROR|WARN' ../apollo.log | tail -100 || true

      - name: Run tests
        run: |
          cd python-apollo
          export ARROW_GLOBAL_CONFIG_PATH=$(pwd)/test-data/local-apollo2-arrow.yml
          python -m pytest -v

      - name: Print Apollo log on failure
        if: failure()
        run: |
          echo "=== Last 500 lines of Apollo log ==="
          tail -500 apollo.log
