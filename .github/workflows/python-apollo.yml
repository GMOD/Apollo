name: Python-Apollo

on:
  push:
    branches: [develop, apollo_g7]
  pull_request:
    branches: [develop]

jobs:
  test-python-apollo:
    name: test-python-apollo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Apollo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Apollo
        run: ./gradlew classes

      - name: Start Apollo
        run: |
          ./gradlew bootRun > apollo.log 2>&1 &

          # Wait for health endpoint
          for i in $(seq 1 300); do
            response=$(curl -s 'http://localhost:8080/apollo/health/index' 2>/dev/null || true)
            if echo "$response" | grep -q '"status":"ready"'; then
              echo "Apollo is ready (${i}s)"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "FAIL: Apollo not ready after 300 seconds"
              cat apollo.log
              exit 1
            fi
            sleep 1
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout python-apollo
        uses: actions/checkout@v4
        with:
          repository: galaxy-genome-annotation/python-apollo
          path: python-apollo
          ref: master

      - name: Install python-apollo
        run: |
          cd python-apollo
          pip install apollo pytest

      - name: Bootstrap test data
        run: |
          cd python-apollo
          export ARROW_GLOBAL_CONFIG_PATH=$(pwd)/test-data/local-apollo2-arrow.yml
          ./bootstrap_apollo.sh --nodocker

      - name: Diagnose organism state
        run: |
          cd python-apollo
          export ARROW_GLOBAL_CONFIG_PATH=$(pwd)/test-data/local-apollo2-arrow.yml
          echo "=== Organisms ==="
          arrow organisms get_organisms
          echo "=== Sequences for test_organism ==="
          arrow organisms get_sequences test_organism || true
          echo "=== Apollo ERROR/WARN log lines ==="
          grep -E 'ERROR|WARN' ../apollo.log | tail -50 || true

      - name: Run tests
        run: |
          cd python-apollo
          export ARROW_GLOBAL_CONFIG_PATH=$(pwd)/test-data/local-apollo2-arrow.yml
          python -m pytest -v

      - name: Print Apollo log on failure
        if: failure()
        run: |
          echo "=== Last 200 lines of Apollo log ==="
          tail -200 apollo.log
