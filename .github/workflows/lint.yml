name: Lint

on:
  push:
    branches: [develop, apollo_g7]
  pull_request:
    branches: [develop]

jobs:
  groovy-compile:
    name: Groovy compilation check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Groovy sources
        run: ./gradlew compileGroovy
